spring:
  application:
    name: device-service
  datasource:
    url: jdbc:mysql://localhost:3306/home_energy_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
    service:
      port: 8080
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true
server:
  port: 8081
  logging:
    level:
      com.adetayo.user_service: DEBUG
